name: Notify Discord on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_name:
        description: Release title
        required: false
        default: "BeastStrap v420.77.0"
      release_body:
        description: Release notes body
        required: false
        default: "Test release notes from workflow_dispatch."
      release_url:
        description: Release URL
        required: false
        default: "https://github.com/revenantsupport-spec/BeastStrap/releases"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post release notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAME: ${{ github.event.release.name || inputs.release_name }}
          URL: ${{ github.event.release.html_url || inputs.release_url }}
          BODY: ${{ github.event.release.body || inputs.release_body }}
        run: |
          MAX_BODY=3900
          if [ ${#BODY} -gt "$MAX_BODY" ]; then
            BODY="${BODY:0:$MAX_BODY}
          ... (truncated, see release link for full notes)"
          fi
          payload=$(jq -n \
            --arg name "$NAME" \
            --arg url "$URL" \
            --arg body "$BODY" \
            '{
              "embeds": [{
                "title": ("Released: " + $name),
                "url": $url,
                "description": $body,
                "color": 5793266
              }]
            }')
          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"