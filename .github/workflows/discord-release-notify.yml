name: Notify Discord on Release

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post release notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAME: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
        run: |
          MAX_BODY=3900
          if [ ${#BODY} -gt "$MAX_BODY" ]; then
            BODY="${BODY:0:$MAX_BODY}
          ... (truncated, see release link for full notes)"
          fi
          payload=$(jq -n \
            --arg name "$NAME" \
            --arg url "$URL" \
            --arg body "$BODY" \
            '{
              "embeds": [{
                "title": ("Released: " + $name),
                "url": $url,
                "description": $body,
                "color": 5793266
              }]
            }')
          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"