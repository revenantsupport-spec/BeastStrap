name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained true .\MrExStrap\BeastStrap.csproj

    - name: Upload Artifact
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: BeastStrap (Release) (${{ github.sha }})
        path: .\MrExStrap\bin\Release\net6.0-windows\win-x64\publish\*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # needed for softprops/action-gh-release to create + upload assets on the tag's release
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: BeastStrap (Release) (${{ github.sha }})
          path: release

      # SignPath Foundation signing — re-enable once the fork is approved.
      # Update organization-id / project-slug / signing-policy-slug / artifact-configuration-slug
      # to match your approved SignPath project, then uncomment.
      #
      # - name: Sign artifact
      #   uses: signpath/github-action-submit-signing-request@v2.0
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     organization-id: 'YOUR_ORG_ID'
      #     project-slug: 'mrexlivechannelforcer'
      #     signing-policy-slug: 'release-signing'
      #     artifact-configuration-slug: 'github-ci'
      #     github-artifact-id: '${{ needs.build.outputs.artifact-id }}'
      #     wait-for-completion: true
      #     output-artifact-directory: 'release'

      - name: Prepare binaries
        # Ship two copies of the same exe: a versioned name for the archive, and a stable "BeastStrap.exe"
        # so https://.../releases/latest/download/BeastStrap.exe is a permanent one-click download link.
        run: |
          cp release/BeastStrap.exe BeastStrap-${{ github.ref_name }}.exe
          cp release/BeastStrap.exe BeastStrap.exe

      - name: Generate SHA256SUMS
        run: |
          set -e
          sha256sum BeastStrap-${{ github.ref_name }}.exe BeastStrap.exe > SHA256SUMS
          cat SHA256SUMS

      # The updater script (BeastStrapUpdater.ps1) creates the release itself and
      # uploads BeastStrap.exe, so the tag usually already has a release by the
      # time this job runs. Creating a second one would race it (duplicate tag or
      # duplicate asset uploads). Only create when absent; otherwise attach the
      # versioned exe + SHA256SUMS to the existing release.
      - name: Check if a release already exists for this tag
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release for $GITHUB_REF_NAME already exists (created by the updater script)."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check-release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            BeastStrap-${{ github.ref_name }}.exe
            BeastStrap.exe
            SHA256SUMS
          name: BeastStrap ${{ github.ref_name }}

      - name: Attach assets to existing release
        if: steps.check-release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            BeastStrap-${{ github.ref_name }}.exe BeastStrap.exe SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
